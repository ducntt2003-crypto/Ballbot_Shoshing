[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sloshbot-rl"
version = "0.1.0"
description = "Two reproducible MuJoCo experiments for a liquid-carrying BallBot"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = ["mujoco==3.3.2", "numpy==2.2.6", "scipy==1.15.3", "torch==2.7.0", "stable-baselines3==2.6.0", "gymnasium==1.1.1", "matplotlib==3.10.9", "opencv-python==4.11.0.86", "Pillow==11.2.1", "glfw==2.10.2"]

[project.scripts]
sloshbot-teleop = "sloshbot.teleop:main"
sloshbot-evaluate = "sloshbot.experiment:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sloshbot*"]
