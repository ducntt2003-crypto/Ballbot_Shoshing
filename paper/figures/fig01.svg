    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(33.5369 68.70525)">Figure-eight reference</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(39.78815 77.6635)">position / velocity /</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(53.13315 86.62175)">acceleration</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(193.9467 68.70525)">Cascade + privileged V4</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(207.837325 77.6635)">optional teacher /</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(218.16795 86.62175)">PPO residual</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(389.4009 73.184375)">Native MuJoCo</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(372.177775 82.142625)">BallBot + rough terrain</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(382.379025 187.01565)">One moving mass</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(384.812775 195.9739)">two modal slides</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(375.225275 204.93215)">with springs/damping</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(192.62545 191.494775)">True state / causal logger</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(193.848575 200.453025)">contact and ROM guards</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(16.9344 193.002994)">Schematic only.</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(16.9344 200.841462)">No resolved free surface.</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(16.9344 208.679931)">Native modal coupling</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(16.9344 216.5184)">acts in both directions.</text>
